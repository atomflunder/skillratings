[package]
name = "skillratings"
version = "0.28.2"
edition = "2021"
description = "Calculate a player's skill rating using algorithms like Elo, Glicko-2, TrueSkill and many more."
readme = "README.md"
repository = "https://github.com/atomflunder/skillratings"
homepage = "https://github.com/atomflunder/skillratings"
documentation = "https://docs.rs/skillratings/"
license = "MIT OR Apache-2.0"
keywords = ["elo", "glicko", "trueskill", "multiplayer", "rating"]
categories = ["game-development", "algorithms", "mathematics"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", optional = true, features = ["derive"] }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[features]
default = []
wasm = ["wasm-bindgen", "js-sys"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "bench_main"
harness = false
