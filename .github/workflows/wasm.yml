name: Build & Publish WASM npm package

on:
  push:
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wasm:
    name: Build WASM package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM (bundler target)
        run: wasm-pack build --release --target bundler --features wasm

      - name: Build WASM (nodejs target)
        run: wasm-pack build --release --target nodejs --features wasm --out-dir pkg-node

      - name: Upload pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: pkg/

  publish-npm:
    name: Publish to npm
    needs: build-wasm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: pkg/

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish
        run: npm publish --access public
        working-directory: pkg/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
